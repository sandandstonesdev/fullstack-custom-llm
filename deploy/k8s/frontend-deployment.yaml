# Frontend: deployment + service (DRAFT, replicas: 1).
# Static Astro build served by nginx (frontend/Dockerfile + nginx.conf).
#
# Build: podman build -f frontend/Dockerfile -t polish-llm-frontend:latest ./frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: polish-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: polish-llm-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: polish-llm
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
