apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polish-llm-frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: chat.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: polish-llm-frontend
            port:
              number: 80
  tls:
  - hosts:
    - chat.yourdomain.com
    secretName: polish-llm-frontend-tls