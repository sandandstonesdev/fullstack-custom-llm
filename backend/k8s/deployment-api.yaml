apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: polish-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: polish-llm-backend
        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: polish-llm-data-claim