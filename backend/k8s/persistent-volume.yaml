apiVersion: v1
kind: PersistentVolume
metadata:
  name: polish-llm-data
  namespace: polish-llm
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /data/polish-llm  # Replace with your host path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polish-llm-data-claim
  namespace: polish-llm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi