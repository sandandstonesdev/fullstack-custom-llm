apiVersion: batch/v1
kind: Job
metadata:
  name: prepare-dataset
  namespace: polish-llm
spec:
  template:
    spec:
      containers:
      - name: prepare-dataset
        image: polish-llm-backend
        command: ["python", "main.py", "--prepare_dataset"]
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      restartPolicy: Never
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: polish-llm-data-claim